<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2481cc">
  <title>VA Chat — школьный мессенджер</title>
  <link rel="preconnect" href="https://zohhimpltawkaflzxdxe.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="//zohhimpltawkaflzxdxe.supabase.co">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body class="session-checking">
  <div id="sessionLoading" role="status" aria-live="polite">Загрузка VA Chat…</div>
  <main id="app">
    <section class="auth-card">
      <div class="logo">💬</div>
      <h1>VA Chat</h1>
      <p class="subtitle">Общайся со своим классом</p>

      <div class="tabs">
        <button id="loginTab" class="tab active" type="button">
          Вход
        </button>
        <button id="registerTab" class="tab" type="button">
          Регистрация
        </button>
      </div>

      <form id="authForm">
        <div class="field">
          <label for="role">Кто ты?</label>
          <select id="role">
            <option value="student">Ученик</option>
            <option value="teacher">Учитель</option>
          </select>
        </div>

        <div class="field">
          <label for="username">Имя пользователя</label>
          <input id="username" required minlength="3" maxlength="24"
            pattern="[A-Za-zА-Яа-яЁё0-9_\x2D]{3,24}"
            placeholder="Например, Иван5" autocomplete="username">
          <small>Без пробелов. Можно использовать буквы и цифры.</small>
        </div>

        <div class="field">
          <label for="password">Пароль аккаунта</label>
          <input id="password" type="password" required minlength="6"
            maxlength="72" placeholder="Минимум 6 символов"
            autocomplete="current-password">
        </div>

        <div class="field">
          <label for="className">Название класса</label>
          <input id="className" required maxlength="30"
            placeholder="Например, 5А" autocomplete="off">
        </div>

        <div class="field">
          <label for="classPassword">Пароль класса</label>
          <input id="classPassword" type="password" required
            minlength="6" maxlength="128"
            placeholder="Пароль, который сообщил учитель"
            autocomplete="off">
        </div>

        <div id="teacherCodeField" class="field hidden">
          <label for="teacherCode">Секретный код учителя</label>
          <input id="teacherCode" type="password"
            autocomplete="off" placeholder="Код для регистрации учителя">
        </div>

        <p id="classHint" class="hint"></p>

        <button class="submit-btn" type="submit" id="submitBtn">
          Войти
        </button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script>
    (function loadSupabaseSdk() {
      const sources = [
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",
        "https://unpkg.com/@supabase/supabase-js@2"
      ];
      const status = document.createElement("p");
      status.id = "startupStatus";
      status.className = "message";
      status.setAttribute("role", "status");
      status.textContent = "Загрузка VA Chat…";
      document.querySelector(".auth-card")?.append(status);

      function loadSdk(index) {
        if (index >= sources.length) {
          document.body.classList.remove("session-checking");
          status.className = "message error";
          status.textContent = "Не удалось загрузить библиотеку чата. Проверь подключение к интернету и обнови страницу.";
          document.querySelector("#sessionLoading")?.remove();
          return;
        }
        const script = document.createElement("script");
        script.src = sources[index];
        script.async = true;
        script.onload = () => {
          if (!window.supabase?.createClient) {
            script.remove();
            loadSdk(index + 1);
            return;
          }
          status.remove();
          document.querySelector("#sessionLoading")?.remove();
          const appScript = document.createElement("script");
          appScript.src = "script.js";
          appScript.onerror = () => {
            status.className = "message error";
            status.textContent = "Не удалось загрузить файлы VA Chat. Обнови страницу или проверь размещение script.js.";
            document.body.classList.remove("session-checking");
            document.querySelector("#sessionLoading")?.remove();
            document.querySelector(".auth-card")?.append(status);
          };
          document.body.append(appScript);
        };
        script.onerror = () => {
          script.remove();
          loadSdk(index + 1);
        };
        document.head.append(script);
      }
      loadSdk(0);
    })();
  </script>
</body>
</html>
