<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#10b981">
  <meta name="description" content="VA Chat — школьный мессенджер">
  <title>VA Chat — школьный мессенджер</title>
  <link rel="preconnect" href="https://zohhimpltawkaflzxdxe.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="//zohhimpltawkaflzxdxe.supabase.co">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2310b981'/%3E%3Cpath d='M9 8h14a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-8l-5 4v-4a4 4 0 0 1-4-4v-6a4 4 0 0 1 4-4z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-bg-orbs">
      <span class="splash-orb s1"></span>
      <span class="splash-orb s2"></span>
      <span class="splash-orb s3"></span>
    </div>
    <div class="splash-particles">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="splash-content">
      <div class="splash-logo-wrap">
        <div class="splash-ring s-ring-1"></div>
        <div class="splash-ring s-ring-2"></div>
        <div class="splash-logo">
          <svg viewBox="0 0 32 32" width="60" height="60" fill="none">
            <path d="M9 5h14a7 7 0 0 1 7 7v8a7 7 0 0 1-7 7h-8l-7 5v-5a7 7 0 0 1-6-7v-8a7 7 0 0 1 7-7z" fill="#fff"/>
            <circle cx="12" cy="16" r="1.9" fill="#10b981"/>
            <circle cx="16" cy="16" r="1.9" fill="#10b981"/>
            <circle cx="20" cy="16" r="1.9" fill="#10b981"/>
          </svg>
        </div>
      </div>
      <h2 class="splash-title">
        <span>V</span><span>A</span><span>&nbsp;</span><span>C</span><span>h</span><span>a</span><span>t</span>
      </h2>
      <p class="splash-subtitle">Школьный мессенджер</p>
      <div class="splash-progress"><div class="splash-progress-bar"></div></div>
      <div class="splash-loader"><span></span><span></span><span></span></div>
    </div>
  </div>

  <main id="app">
    <div class="auth-bg-decor" aria-hidden="true">
      <span class="decor-blob db1"></span>
      <span class="decor-blob db2"></span>
      <span class="decor-blob db3"></span>
      <span class="decor-float d1">💬</span>
      <span class="decor-float d2">✨</span>
      <span class="decor-float d3">📚</span>
      <span class="decor-float d4">🌟</span>
      <span class="decor-float d5">💡</span>
      <span class="decor-float d6">🎉</span>
      <span class="decor-star s1">✦</span>
      <span class="decor-star s2">✦</span>
      <span class="decor-star s3">✦</span>
    </div>

    <section class="auth-card">
      <div class="auth-orbs" aria-hidden="true">
        <span class="orb orb-1"></span>
        <span class="orb orb-2"></span>
        <span class="orb orb-3"></span>
      </div>

      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="38" height="38" fill="none">
          <path d="M9 5h14a7 7 0 0 1 7 7v8a7 7 0 0 1-7 7h-8l-7 5v-5a7 7 0 0 1-6-7v-8a7 7 0 0 1 7-7z" fill="#fff"/>
          <circle cx="12" cy="16" r="1.9" fill="#10b981"/>
          <circle cx="16" cy="16" r="1.9" fill="#10b981"/>
          <circle cx="20" cy="16" r="1.9" fill="#10b981"/>
        </svg>
      </div>

      <h1>VA Chat</h1>
      <p class="subtitle">Общайся со своим классом</p>

      <div class="tabs" role="tablist">
        <button id="loginTab" class="tab active" type="button" role="tab" aria-selected="true">Вход</button>
        <button id="registerTab" class="tab" type="button" role="tab" aria-selected="false">Регистрация</button>
      </div>

      <form id="authForm">
        <div class="field">
          <label for="role">Кто ты?</label>
          <select id="role">
            <option value="student">Ученик</option>
            <option value="teacher">Учитель</option>
          </select>
        </div>
        <div class="field">
          <label for="username">Имя пользователя</label>
          <input id="username" required minlength="3" maxlength="24" pattern="[A-Za-zА-Яа-яЁё0-9_-]{3,24}" placeholder="Например, Иван5" autocomplete="username">
          <small>Без пробелов. Можно использовать буквы и цифры.</small>
        </div>
        <div class="field">
          <label for="password">Пароль аккаунта</label>
          <input id="password" type="password" required minlength="6" maxlength="72" placeholder="Минимум 6 символов" autocomplete="current-password">
        </div>
        <div class="field">
          <label for="className">Название класса</label>
          <input id="className" required maxlength="30" placeholder="Например, 5А" autocomplete="off">
        </div>
        <div class="field">
          <label for="classPassword">Пароль класса</label>
          <input id="classPassword" type="password" required minlength="6" maxlength="128" placeholder="Пароль, который сообщил учитель" autocomplete="off">
        </div>
        <div id="teacherCodeField" class="field hidden">
          <label for="teacherCode">Секретный код учителя</label>
          <input id="teacherCode" type="password" autocomplete="off" placeholder="Код для регистрации учителя">
        </div>
        <p id="classHint" class="hint"></p>
        <button class="submit-btn" type="submit" id="submitBtn">Войти</button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script>
    (function loadSupabaseSdk() {
      const sources = [
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",
        "https://unpkg.com/@supabase/supabase-js@2"
      ];
      const status = document.createElement("p");
      status.id = "startupStatus";
      status.className = "message";
      status.setAttribute("role", "status");
      status.textContent = "Загрузка VA Chat…";
      document.querySelector(".auth-card")?.append(status);
      setTimeout(() => {
        const splash = document.getElementById("splash");
        if (splash && !splash.classList.contains("hide")) {
          splash.classList.add("hide");
          setTimeout(() => splash.remove(), 600);
        }
      }, 7000);
      function loadSdk(index) {
        if (index >= sources.length) {
          status.className = "message error";
          status.textContent = "Не удалось загрузить библиотеку чата.";
          return;
        }
        const script = document.createElement("script");
        script.src = sources[index];
        script.async = true;
        script.onload = () => {
          if (!window.supabase?.createClient) { script.remove(); loadSdk(index + 1); return; }
          status.remove();
          const appScript = document.createElement("script");
          appScript.src = "script.js";
          appScript.onerror = () => {
            status.className = "message error";
            status.textContent = "Не удалось загрузить script.js.";
            document.querySelector(".auth-card")?.append(status);
            const splash = document.getElementById("splash");
            if (splash) { splash.classList.add("hide"); setTimeout(() => splash.remove(), 600); }
          };
          document.body.append(appScript);
        };
        script.onerror = () => { script.remove(); loadSdk(index + 1); };
        document.head.append(script);
      }
      loadSdk(0);
    })();
  </script>
</body>
</html>
